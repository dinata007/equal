<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f2f1ef" />
		<meta name="description" content="Senja ERP — Material, Inventory, Sales, Toko, Akunting & HR" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Senja" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="64x64" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Terapkan tampilan (mode light/dark, ukuran teks) sebelum render agar tidak berkedip.
			// Logika lengkapnya di src/lib/erp/appearance.svelte.ts.
			try {
				const h = document.documentElement;
				const p = JSON.parse(localStorage.getItem('senja:prefs') || 'null') || { theme: localStorage.getItem('senja:theme') || 'system' };
				if (p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
					h.classList.add('dark');
					document.querySelector('meta[name=theme-color]').setAttribute('content', '#0c0a09');
				}
				const fs = { sm: '93.75%', lg: '106.25%', xl: '112.5%' }[p.textSize];
				if (fs) h.style.fontSize = fs;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
