name: Deploy to Windows Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DB_SERVER: ${{ secrets.DB_SERVER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_DOMAIN: ${{ secrets.DB_DOMAIN }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      APP_PORT: ${{ secrets.APP_PORT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write .env for packaging
        shell: bash
        run: |
          cat > .env <<EOF
          DB_SERVER=${DB_SERVER}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_DOMAIN=${DB_DOMAIN}
          DOMAIN=${APP_DOMAIN}
          PORT=${APP_PORT}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build deployment package
        run: npm run deploy:pack

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: senja-win-deploy
          path: deploy/senja-deploy-*.zip
          if-no-files-found: error

  deploy-to-windows-server:
    needs: build-deploy-package
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: senja-win-deploy
          path: ${{ runner.temp }}\senja-deploy

      - name: Update installed server app
        shell: powershell
        env:
          APP_DIR: ${{ secrets.WINDOWS_APP_DIR }}
        run: |
          $artifact = Get-ChildItem "$env:RUNNER_TEMP\senja-deploy\*.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $artifact) {
            throw 'Tidak ada artifact deploy zip yang dihasilkan.'
          }

          $appDir = if (-not [string]::IsNullOrWhiteSpace("${{ secrets.WINDOWS_APP_DIR }}")) {
            "${{ secrets.WINDOWS_APP_DIR }}"
          } else {
            'D:\Web\Senja'
          }

          if (-not $appDir) {
            throw 'Folder aplikasi tidak ditemukan. Set secret WINDOWS_APP_DIR atau sesuaikan default workflow ke folder server Anda.'
          }

          if (-not (Test-Path $appDir)) {
            throw "Folder aplikasi tidak ditemukan: $appDir"
          }

          $zipPath = Join-Path $appDir $artifact.Name
          Copy-Item $artifact.FullName $zipPath -Force

          $scriptPath = Join-Path $appDir 'pasang.ps1'
          if (-not (Test-Path $scriptPath)) {
            throw "Script pasang.ps1 tidak ada di $appDir. Pastikan folder aplikasi sudah sesuai dengan paket deploy Senja."
          }

          Write-Host "Deploying: $artifact.FullName -> $zipPath"
          & powershell -NoProfile -ExecutionPolicy Bypass -File $scriptPath -Update -Zip $zipPath
